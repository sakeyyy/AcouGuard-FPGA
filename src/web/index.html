<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声境 · 四路音频观察台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="eyebrow">AX7021 / AUDIO LAB</span><h1>声境 <span>音频观察台</span></h1></div><div class="connection"><i id="dot"></i><span id="status">未连接开发板</span></div></header>
<main><section class="toolbar"><label>串口<select id="port" aria-label="串口"></select></label><button id="refresh" title="刷新串口列表" aria-label="刷新串口列表">↻</button><label>波特率<select id="baud"><option>115200</option><option>230400</option><option>460800</option><option>921600</option></select></label><button id="connect" class="primary">连接</button><button id="disconnect">断开</button><div class="divider"></div><label>通道<select id="channel"><option value="0">前方 CH0</option></select></label><label>时间窗<select id="window"><option value="0.25">250 ms</option><option value="0.5">500 ms</option><option value="1" selected>1 s</option><option value="2">2 s</option></select></label><label>纵轴<select id="scale"><option value="auto">共同自动量程</option><option value="1">±1 FS</option><option value="0.1">±0.1 FS</option><option value="0.01">±0.01 FS</option></select></label></section>
<section class="summary"><div><span>识别声音</span><strong id="sound">等待识别</strong></div><div><span>采样率</span><strong id="rate">—</strong></div><div><span>处理后 RMS</span><strong id="rms">—</strong></div><div><span>处理后电平</span><strong id="dbfs">—</strong></div><div><span>流状态</span><strong id="mode">等待 PCM</strong></div><div><span>丢包 / CRC</span><strong id="errors">0 / 0</strong></div></section>
<p id="boarderror" role="status"></p><section class="filters"><label>高通 Hz<input id="hp" type="number" value="80" min="0" max="1000" step="10"></label><label>低通 Hz<input id="lp" type="number" value="1000" min="100" max="2000" step="50"></label><label>工频抑制<select id="notch"><option value="0">关闭</option><option value="50">50 Hz</option><option value="60">60 Hz</option></select></label><button id="apply">应用滤波</button><span class="filter-state" id="filterstate">高通 80 Hz · 低通 1000 Hz</span></section>
<section class="scope"><div class="plot-title"><h2><i class="legend raw"></i>接收波形</h2><span id="rawlabel">等待开发板音频</span></div><div class="canvas-wrap"><canvas id="raw" aria-label="接收波形"></canvas><div id="empty">等待真实 PCM 数据</div></div></section>
<section class="scope"><div class="plot-title"><h2><i class="legend processed"></i>处理后波形</h2><span>相同纵轴 · 幅值保留</span></div><div class="canvas-wrap"><canvas id="processed" aria-label="滤波后波形"></canvas></div></section>
<footer><span id="detail">尚未收到音频帧</span><div><button id="pause" aria-pressed="false">暂停显示</button><button id="clear">清空</button><button id="export" disabled>导出对比 WAV</button></div></footer><p id="message" role="status"></p></main><script src="/app.js"></script></body></html>
